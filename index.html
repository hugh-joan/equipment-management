/* ============ 数据层（云端 Supabase + 本地缓存） ============ */
const SUPABASE_URL = "https://gklpruopyrxurbnyhvxd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Az-8Hm3d7rNgnLT8hzfHTA_vUyf9b9b";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const KEY="eqms_v1";
const DOC_ID="main-doc";
let DB=null;
let remoteReady=false;

async function loadFromCloud(){
  try{
    const {data,error} = await sb.from('records').select('data').eq('id',DOC_ID).single();
    if(error || !data){
      DB = seed();
      await pushToCloud();
    }else{
      DB = data.data;
      localStorage.setItem(KEY, JSON.stringify(DB));
    }
    remoteReady=true;
  }catch(e){
    console.warn('云端加载失败，使用本地数据', e);
    if(!DB) DB = seed();
  }
  render();
}

async function pushToCloud(){
  if(!remoteReady) return;
  try{
    await sb.from('records').upsert({id:DOC_ID, data:DB, updated_at:new Date().toISOString()});
  }catch(e){ console.warn('云端保存失败', e); }
}

function subscribeChanges(){
  sb.channel('db-changes')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'records',filter:`id=eq.${DOC_ID}`},(payload)=>{
      if(payload.new && payload.new.data){
        DB = payload.new.data;
        localStorage.setItem(KEY, JSON.stringify(DB));
        render();
      }
    })
    .subscribe();
}

function save(){
  localStorage.setItem(KEY, JSON.stringify(DB));
  pushToCloud();
}
function eqById(id){ return DB.equipment.find(e=>e.id===id); }
function spareById(id){ return DB.spare.find(s=>s.id===id); }

/* ============ 下拉选项（名称（编号），按分组） ============ */
function eqOptions(){
  const g={};
  DB.equipment.forEach(e=>{ const k=e.process||"其他"; (g[k]=g[k]||[]).push({v:e.id,t:e.name+"（"+e.id+"）"}); });
  return Object.entries(g).map(([group,items])=>({group,items}));
}
function spareOptions(){
  const g={};
  DB.spare.forEach(s=>{ const k=s.cat||"其他"; (g[k]=g[k]||[]).push({v:s.id,t:s.name+"（"+s.id+"）"}); });
  return Object.entries(g).map(([group,items])=>({group,items}));
}

/* ============ 计算 ============ */
function hours(a,b){ if(!a||!b) return ""; const h=(new Date(b)-new Date(a))/36e5; if(isNaN(h)) return ""; return Math.round(h*10)/10; }
function faultDur(f){ return hours(f.occurTime,f.recoverTime)||0; }
function faultRepeat(f){
  if(!f.occurTime) return "";
  return DB.fault.some(o=>o.id!==f.id&&o.eqId===f.eqId&&o.part===f.part&&o.valid==="有效"&&o.occurTime&&new Date(o.occurTime)<new Date(f.occurTime)&&(new Date(f.occurTime)-new Date(o.occurTime))/864e5<=90)?"是":"否";
}
function spareIn(id){ return DB.spareTxn.filter(t=>t.spareId===id&&t.type==="入库").reduce((a,t)=>a+(+t.qty||0),0); }
function spareOut(id){ return DB.spareTxn.filter(t=>t.spareId===id&&t.type==="出库").reduce((a,t)=>a+(+t.qty||0),0); }
function spareBack(id){ return DB.spareTxn.filter(t=>t.spareId===id&&t.type==="退库").reduce((a,t)=>a+(+t.qty||0),0); }
function spareStock(id){ return spareIn(id)-spareOut(id)+spareBack(id); }
function maintOverdue(m){
  if(!m.planDate||m.status==="已完成"||m.status==="已取消") return "";
  return new Date()>new Date(m.planDate)?"逾期":"";
}
function todoRemain(t){
  if(!t.deadline||t.status==="已完成"||t.status==="已取消") return "";
  return Math.round((new Date(t.deadline)-new Date())/864e5);
}

/* ============ 指标 ============ */
function monthRange(ym){ const [y,m]=ym.split("-").map(Number); return [new Date(y,m-1,1),new Date(y,m,1)]; }
function inMonth(dt,s,e){ if(!dt) return false; const d=new Date(dt); return d>=s&&d<e; }
function metrics(ym){
  const [s,e]=monthRange(ym), eq=DB.equipment;
  const total=eq.length, key=eq.filter(x=>x.level==="A").length;
  const good=eq.filter(x=>x.status==="在用正常").length;
  const goodKey=eq.filter(x=>x.level==="A"&&x.status==="在用正常").length;
  const vf=DB.fault.filter(f=>f.valid==="有效");
  const mf=vf.filter(f=>inMonth(f.occurTime,s,e));
  const mfKey=mf.filter(f=>{const q=eqById(f.eqId);return q&&q.level==="A";});
  const dur=mf.reduce((a,f)=>a+faultDur(f),0);
  const days=Math.round((e-s)/864e5);
  const mtbf=mf.length?Math.round(days*24*total/mf.length*10)/10:"";
  const mttr=mf.length?Math.round(dur/mf.length*10)/10:"";
  const planM=DB.maint.filter(m=>m.type==="计划检修"&&inMonth(m.planDate,s,e));
  const planDone=planM.filter(m=>m.status==="已完成");
  const hidM=DB.maint.filter(m=>m.type==="隐患整改"&&inMonth(m.planDate,s,e));
  const hidDone=hidM.filter(m=>m.status==="已完成");
  const spCost=DB.spareTxn.filter(t=>t.type==="出库"&&inMonth(t.date,s,e)).reduce((a,t)=>a+((+t.qty||0)*(spareById(t.spareId)?.price||0)),0);
  return {ym,total,key,good,goodKey,goodRate:total?good/total:0,keyGoodRate:key?goodKey/key:0,
    mf,mfKey,dur,mtbf,mttr,planTotal:planM.length,planDone:planDone.length,
    planRate:planM.length?planDone.length/planM.length:0,
    hidTotal:hidM.length,hidDone:hidDone.length,hidRate:hidM.length?hidDone.length/hidM.length:0,spCost};
}
function groupStat(arr,field,catList,durFn){
  return catList.map(c=>{ const g=arr.filter(x=>x[field]===c); return {name:c,cnt:g.length,dur:g.reduce((a,x)=>a+(durFn?durFn(x):0),0)}; });
}

let curTab="equipment";
const TABS=[["equipment","设备台账"],["repair","报修工单"],["fault","故障记录"],["spare","备件台账"],
  ["spareTxn","备件流水"],["maint","检修与隐患"],["metrics","运行指标"],["status","设备现状"],["todo","待办清单"]];

function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function val(r,k,f){
  if(f&&f.calc) return f.calc(r);
  if(k==="eqName") return eqById(r.eqId)?.name||"";
  if(k==="level") return eqById(r.eqId)?.level||"";
  if(k==="spareName") return spareById(r.spareId)?.name||"";
  if(k==="key") return r.level==="A"?"是":"否";
  if(k==="duration") return faultDur(r);
  if(k==="repeat") return faultRepeat(r);
  if(k==="stock") return spareStock(r.id);
  if(k==="warn") return spareStock(r.id)<=(+r.safeStock||0)?"⚠补货":"";
  if(k==="amount") return Math.round((+r.qty||0)*(spareById(r.spareId)?.price||0)*100)/100;
  if(k==="price"&&r.spareId) return spareById(r.spareId)?.price||"";
  if(k==="overdue"&&r.planDate!==undefined) return maintOverdue(r);
  if(k==="overdue"&&r.deadline!==undefined){const d=todoRemain(r);return d!==""&&d<0?"逾期":"";}
  if(k==="remain") return todoRemain(r);
  return r[k]??"";
}
function colLabel(mod,k){ const f=M[mod].fields.find(x=>x.k===k); return f?f.lb:k; }
function fmtCell(mod,k,v){
  if(v===""||v===null||v===undefined) return "";
  if(k==="level"||k==="key"){ const c=v==="A"?"t-red":v==="B"?"t-yel":"t-gry"; return `<span class="tag ${c}">${esc(v)}</span>`; }
  if(k==="valid") return `<span class="tag ${v==="有效"?"t-grn":"t-gry"}">${esc(v)}</span>`;
  if(k==="status"||k==="overdue"||k==="warn"||k==="isFault"){
    const red=["逾期","⚠补货","在用异常","未完成","抢修"].includes(v);
    const grn=["已解决","已完成","在用正常","有效"].includes(v);
    if(v==="是"&&k==="isFault") return `<span class="tag t-grn">是</span>`;
    if(red) return `<span class="tag t-red">${esc(v)}</span>`;
    if(grn) return `<span class="tag t-grn">${esc(v)}</span>`;
    return `<span class="tag t-blu">${esc(v)}</span>`;
  }
  if(k==="repeat") return v==="是"?`<span class="tag t-red">重复</span>`:`<span class="tag t-gry">否</span>`;
  return esc(v);
}

function renderNav(){
  document.getElementById("nav").innerHTML=TABS.map(([k,n])=>`<button data-tab="${k}" class="${k===curTab?'on':''}">${n}</button>`).join("");

  renderNav();
  const main=document.getElementById("main");
  if(curTab==="metrics"){ main.innerHTML=renderMetrics(); bindMetrics(); return; }
  if(curTab==="status"){ main.innerHTML=renderStatus(); return; }
  const m=M[curTab];
  const rows=DB[curTab]||[];
  let html=`<div class="bar"><h2>${m.name} <span style="color:#9ca3af;font-weight:400;font-size:12px">共 ${rows.length} 条</span></h2>
    <button class="btn primary" data-act="add" data-mod="${curTab}">+ 新增</button>
    <button class="btn" data-act="export" data-mod="${curTab}">导出 CSV</button></div>`;
  if(curTab==="repair"){
    const bad=rows.filter(r=>r.status==="已完工"&&!r.isFault);
    if(bad.length) html+=`<div class="warn">⚠ 有 ${bad.length} 张已完工工单尚未判定"是否计为故障"，请设备员关闭工单前确认。</div>`;
  }
  html+=`<div class="tbl-wrap"><table><thead><tr>`;
  m.cols.forEach(c=>html+=`<th>${colLabel(curTab,c)}</th>`);
  html+=`<th>操作</th></tr></thead><tbody>`;
  if(!rows.length) html+=`<tr><td colspan="${m.cols.length+1}" class="empty">暂无数据，点右上角"新增"</td></tr>`;
  rows.forEach((r,i)=>{
    html+="<tr>";
    m.cols.forEach(c=>{ const f=m.fields.find(x=>x.k===c); html+=`<td>${fmtCell(curTab,c,val(r,c,f))}</td>`; });
    html+=`<td><button class="btn" data-act="edit" data-mod="${curTab}" data-i="${i}">编辑</button>
      <button class="btn danger" data-act="del" data-mod="${curTab}" data-i="${i}">删除</button></td></tr>`;
  });
  html+="</tbody></table></div>";
  main.innerHTML=html;
}

  const card=(lb,vl,un)=>`<div class="card"><div class="lb">${lb}</div><div class="vl">${vl}${un?`<span class="un">${un}</span>`:""}</div></div>`;
  let h=`<div class="bar"><h2>运行指标</h2>

    <input type="month" id="ym" value="${curYM}" style="padding:5px 9px;border:1px solid #d1d5db;border-radius:5px;margin-left:6px"></label></div>`;
  h+=`<div class="kpi">
    ${card("设备总台数",x.total,"台")}${card("关键设备台数",x.key,"台")}
    ${card("完好设备台数",x.good,"台")}${card("设备完好率",pct(x.goodRate))}
    ${card("关键设备完好率",pct(x.keyGoodRate))}${card("故障次数",x.mf.length,"次")}
    ${card("关键设备故障",x.mfKey.length,"次")}${card("停机总时长",x.dur.toFixed(1),"h")}
    ${card("平均处理时长",x.mttr===""?"—":x.mttr,"h")}${card("MTBF",x.mtbf===""?"—":x.mtbf,"h")}
    ${card("计划检修完成率",pct(x.planRate))}${card("隐患闭环率",pct(x.hidRate))}
    ${card("备件消耗费用",x.spCost.toFixed(0),"元")}</div>`;

  const sub=(title,arr,tot)=>{
    let t=`<div class="panel"><h3>${title}</h3><table><thead><tr><th>项目</th><th>次数</th><th>停机时长(h)</th><th>占比</th></tr></thead><tbody>`;
    arr.forEach(a=>{ if(a.cnt===0) return; t+=`<tr><td>${esc(a.name)}</td><td>${a.cnt}</td><td>${a.dur.toFixed(1)}</td><td>${tot?((a.cnt/tot*100).toFixed(1)+"%"):"—"}</td></tr>`; });
    t+=`<tr style="font-weight:600;background:#f9fafb"><td>合计</td><td>${arr.reduce((s,a)=>s+a.cnt,0)}</td><td>${arr.reduce((s,a)=>s+a.dur,0).toFixed(1)}</td><td></td></tr>`;
    return t+"</tbody></table></div>";
  };
  h+=sub("按故障类型统计",groupStat(x.mf,"type",D.faultType,faultDur),x.mf.length);
  h+=sub("按设备类别统计",groupStat(x.mf.map(f=>({...f,cat:eqById(f.eqId)?.cat||""})),"cat",D.cat,faultDur),x.mf.length);
  h+=sub("按重要程度统计",groupStat(x.mf.map(f=>({...f,lv:eqById(f.eqId)?.level||""})),"lv",["A","B","C"],faultDur),x.mf.length);

function openForm(mod,i){
  const m=M[mod];

  let h=`<div class="modal" id="modal"><div class="modal-body"><h3>${i>=0?"编辑":"新增"} · ${m.name}</h3><div class="form-grid">`;
  m.fields.forEach(f=>{

    const v=rec[f.k]??"";
    h+=`<div class="${f.full?"full":""}"><label>${f.lb}${f.req?'<span class="req">*</span>':""}</label>`;
    if(f.t==="sel"){
      const opts=typeof f.o==="function"?f.o():f.o;
      let inner='<option value="">-- 请选择 --</option>';

        if(o&&typeof o==="object"&&o.group){
          inner+=`<optgroup label="${esc(o.group)}">`+
            o.items.map(it=>`<option value="${esc(it.v)}" ${String(it.v)===String(v)?"selected":""}>${esc(it.t)}</option>`).join("")+
            `</optgroup>`;
        }else if(o&&typeof o==="object"){
          inner+=`<option value="${esc(o.v)}" ${String(o.v)===String(v)?"selected":""}>${esc(o.t)}</option>`;
        }else{
          inner+=`<option ${o===v?"selected":""}>${esc(o)}</option>`;

      });
      h+=`<select data-k="${f.k}">${inner}</select>`;
    }else if(f.t==="ta"){
      h+=`<textarea data-k="${f.k}">${esc(v)}</textarea>`;

  const {mod,i}=editing, m=M[mod];
  const rec=i>=0?{...DB[mod][i]}:{};
  document.querySelectorAll("#modal [data-k]").forEach(el=>{
    rec[el.dataset.k]=el.type==="number"?(el.value===""?"":+el.value):el.value;
  });
  for(const f of m.fields){
    if(f.req&&!f.calc&&!(rec[f.k]??"").toString().trim()){ alert(`请填写/选择：${f.lb}`); return; }
  }
  if(mod==="repair"){
    if(rec.status==="已完工"&&!rec.isFault){ alert("工单标记为已完工前，请先判定「是否计为故障」"); return; }
    if(rec.isFault==="否"&&!rec.noFaultReason){ alert("不计为故障时，必须选择「不计故障原因」"); return; }
  }
  if(mod==="repair"&&rec.isFault==="是"&&!rec.faultId){
    const fid="GZ"+new Date().getFullYear()+String(new Date().getMonth()+1).padStart(2,"0")+String(DB.fault.length+1).padStart(3,"0");
    DB.fault.push({id:fid,occurTime:rec.reportTime,recoverTime:rec.finishTime,eqId:rec.eqId,part:"",
      symptom:rec.desc,type:"",cause:"",action:rec.action,handler:rec.assignee,status:"已解决",
      valid:"有效",repairId:rec.id,parts:rec.parts,remark:""});
    rec.faultId=fid;
  }
  if(i>=0) DB[mod][i]=rec; else DB[mod].push(rec);
  save(); closeModal(); render();
}

/* ============ 导出 ============ */
function exportCSV(mod){
  const m=M[mod], rows=DB[mod];
  const head=m.fields.filter(f=>!f.calc||["key","duration","repeat","stock","warn","amount","overdue","remain"].includes(f.k)).map(f=>f.lb);
  const keys=m.fields.filter(f=>!f.calc||["key","duration","repeat","stock","warn","amount","overdue","remain"].includes(f.k)).map(f=>f.k);
  const lines=[head.map(esc).join(",")];
  rows.forEach(r=>{
    lines.push(keys.map(k=>{
      const f=m.fields.find(x=>x.k===k);
      let v=val(r,k,f);
      if(Array.isArray(v)) v=v.join("|");
      return '"'+String(v??"").replace(/"/g,'""')+'"';
    }).join(","));
  });
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=m.name+".csv"; a.click();
  URL.revokeObjectURL(a.href);
}

/* ============ 事件 ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");
  if(t){ curTab=t.dataset.tab; render(); window.scrollTo(0,0); return; }
  const b=e.target.closest("[data-act]");
  if(!b) return;
  const act=b.dataset.act, mod=b.dataset.mod, i=+b.dataset.i;
  if(act==="add") openForm(mod,-1);
  else if(act==="edit") openForm(mod,i);
  else if(act==="del"){
    if(confirm(`确定删除这条记录吗？`)){ DB[mod].splice(i,1); save(); render(); }
  }
  else if(act==="export") exportCSV(mod);
  else if(act==="close") closeModal();
  else if(act==="save") saveForm();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* ============ 初始化：先本地缓存快速渲染，再云端同步 ============ */
try{ DB=JSON.parse(localStorage.getItem(KEY)); }catch(e){ DB=null; }
if(!DB){ DB=seed(); }
render();
loadFromCloud().then(subscribeChanges);
</script>
